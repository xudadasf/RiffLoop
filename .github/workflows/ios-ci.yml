name: iOS CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "RiffLoop/**"
      - "RiffLoopTests/**"
      - "project.yml"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "RiffLoop/**"
      - "RiffLoopTests/**"
      - "project.yml"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build and run unit tests on iPad mini
        run: >-
          xcodebuild test
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,OS=18.5,name=iPad mini (A17 Pro)'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Capture iPad mini launch screenshot
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if runtime.endswith("iOS-18-5") for d in devices if d["name"] == "iPad mini (A17 Pro)"))')"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          APP="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name RiffLoop.app -print -quit)"
          test -d "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl install "$DEVICE_ID" "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl launch "$DEVICE_ID" com.riffloop.prototype
          sleep 2
          mkdir -p TestArtifacts
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl io "$DEVICE_ID" screenshot TestArtifacts/iPad-mini-home.png

      - name: Upload iPad mini screenshot and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiffLoop-iPad-mini-validation
          path: |
            TestArtifacts/iPad-mini-home.png
            DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 30
