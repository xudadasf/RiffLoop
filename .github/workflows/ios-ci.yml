name: iOS CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "RiffLoop/**"
      - "Vendor/ONNXRuntime/**"
      - "scripts/verify-onnx-package.py"
      - "scripts/test-onnx-package.py"
      - "RiffLoopTests/**"
      - "RiffLoopUITests/**"
      - "experiments/gp-draft-editor/**"
      - "experiments/gp-draft-v2/**"
      - "project.yml"
      - "scripts/gp-roundtrip-*"
      - "scripts/test-gp-draft-editor.mjs"
      - "scripts/test-guitar*"
      - "scripts/prepare-score-ocr.py"
      - "scripts/verify-score-resources.py"
      - "scripts/test-gp-roundtrip-audit.py"
      - "scripts/test-gp-playback.mjs"
      - "scripts/test-gp-audio.mjs"
      - "scripts/test-gp-timbre.mjs"
      - "scripts/test-gp-count-in.mjs"
      - "scripts/test-gp-follow.mjs"
      - "scripts/test-gp-transport-recovery.mjs"
      - "scripts/test-gp-display.mjs"
      - "scripts/test-reported-ios-issues.mjs"
      - "scripts/test-video-mode.mjs"
      - "scripts/test-pdf-mode.mjs"
      - "scripts/*ipa*"
      - "scripts/*release*"
      - "scripts/rerun-ci.ps1"
      - "scripts/sideload-install.ps1"
      - "scripts/test-sideload-install.ps1"
      - "scripts/test-reproduction-write-budget.swift"
      - ".github/workflows/ios-unsigned-ipa.yml"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "RiffLoop/**"
      - "Vendor/ONNXRuntime/**"
      - "scripts/verify-onnx-package.py"
      - "scripts/test-onnx-package.py"
      - "RiffLoopTests/**"
      - "RiffLoopUITests/**"
      - "experiments/gp-draft-editor/**"
      - "experiments/gp-draft-v2/**"
      - "project.yml"
      - "scripts/gp-roundtrip-*"
      - "scripts/test-gp-draft-editor.mjs"
      - "scripts/test-guitar*"
      - "scripts/prepare-score-ocr.py"
      - "scripts/verify-score-resources.py"
      - "scripts/test-gp-roundtrip-audit.py"
      - "scripts/test-gp-playback.mjs"
      - "scripts/test-gp-audio.mjs"
      - "scripts/test-gp-timbre.mjs"
      - "scripts/test-gp-count-in.mjs"
      - "scripts/test-gp-follow.mjs"
      - "scripts/test-gp-transport-recovery.mjs"
      - "scripts/test-gp-display.mjs"
      - "scripts/test-reported-ios-issues.mjs"
      - "scripts/test-video-mode.mjs"
      - "scripts/test-pdf-mode.mjs"
      - "scripts/*ipa*"
      - "scripts/*release*"
      - "scripts/rerun-ci.ps1"
      - "scripts/sideload-install.ps1"
      - "scripts/test-sideload-install.ps1"
      - "scripts/test-reproduction-write-budget.swift"
      - ".github/workflows/ios-unsigned-ipa.yml"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:
    inputs:
      run_vision_comparison:
        description: "Run the extended synthetic Vision comparison"
        type: boolean
        default: false

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-write-budget:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Replay routine diagnostics against the real store
        run: |
          xcrun swiftc -parse-as-library RiffLoop/Diagnostics/ReproductionStore.swift scripts/test-reproduction-write-budget.swift -o "$RUNNER_TEMP/reproduction-write-budget"
          "$RUNNER_TEMP/reproduction-write-budget"

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          python3 scripts/test-onnx-package.py
          python3 scripts/prepare-score-ocr.py
          xcodegen generate

      - name: Test playback policies
        run: |
          node scripts/test-gp-playback.mjs
          node scripts/test-gp-display.mjs
          node scripts/test-reported-ios-issues.mjs
          node scripts/test-video-mode.mjs
          node scripts/test-pdf-mode.mjs
          node scripts/test-gp-draft-editor.mjs
          node experiments/gp-draft-v2/test.cjs
          node scripts/test-guitar-draft.cjs
          node scripts/test-guitar-input.cjs
          node scripts/test-guitar-archive.cjs
          python3 scripts/test-gp-roundtrip-audit.py

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Test release safety gates
        run: |
          pwsh -File scripts/test-release-workflow.ps1
          pwsh -File scripts/test-sideload-install.ps1
          python3 scripts/test-verify-ipa.py

      - name: Prepare iPad mini simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess
          import time

          for _ in range(15):
              data = json.loads(subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              ))
              for runtime, devices in data["devices"].items():
                  for device in devices:
                      if runtime.endswith("iOS-18-5") and device["name"] == "iPad mini (A17 Pro)":
                          print(device["udid"])
                          raise SystemExit(0)
              time.sleep(2)

          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "available", "-j"], text=True,
          ))["runtimes"]
          device_types = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devicetypes", "-j"], text=True,
          ))["devicetypes"]
          runtime = next(item for item in runtimes if item["name"] == "iOS 18.5")
          device_type = next(item for item in device_types if item["name"] == "iPad mini (A17 Pro)")
          print(subprocess.check_output([
              "xcrun", "simctl", "create", "RiffLoop iPad mini",
              device_type["identifier"], runtime["identifier"],
          ], text=True).strip())
          PY
          )"
          echo "IPAD_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=180)' \
            xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build iPad mini tests
        run: >-
          xcodebuild build-for-testing
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID"
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Prepare GP panel fixture in the ordinary library
        id: gp_panel_fixture
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/RiffLoop.app"
          test -d "$APP"
          xcrun simctl install "$IPAD_DEVICE_ID" "$APP"
          CONTAINER="$(xcrun simctl get_app_container "$IPAD_DEVICE_ID" com.riffloop.prototype data)"
          test -n "$CONTAINER"
          mkdir -p "$CONTAINER/Documents/GP"
          cp RiffLoopTests/Fixtures/transport.gp "$CONTAINER/Documents/GP/gp-panel-layout-fixture.gp"

      - name: Test loaded GP panels on iPad mini
        run: >-
          xcodebuild test-without-building
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID"
          -derivedDataPath DerivedData
          -parallel-testing-enabled NO
          -only-testing:RiffLoopUITests/GpPanelLayoutTests
          CODE_SIGNING_ALLOWED=NO

      - name: Remove GP fixture and restore a clean UI-test app
        if: always() && steps.gp_panel_fixture.outcome == 'success'
        run: |
          set -euo pipefail
          # This is the CI-only simulator installation. Reinstall it cleanly even
          # after a failed UI assertion, removing the fixture and its practice
          # settings before the existing suites run. No user device is targeted.
          xcrun simctl terminate "$IPAD_DEVICE_ID" com.riffloop.prototype 2>/dev/null || true
          xcrun simctl uninstall "$IPAD_DEVICE_ID" com.riffloop.prototype
          # Discard WebKit processes still holding the removed bundle URL.
          xcrun simctl shutdown "$IPAD_DEVICE_ID"
          xcrun simctl boot "$IPAD_DEVICE_ID"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=180)' \
            xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
          xcrun simctl install "$IPAD_DEVICE_ID" "$PWD/DerivedData/Build/Products/Debug-iphonesimulator/RiffLoop.app"

      - name: Test region selection on iPad mini
        run: >-
          xcodebuild test-without-building
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID"
          -derivedDataPath DerivedData
          -only-testing:RiffLoopTests/ScoreRegionLayoutTests
          -only-testing:RiffLoopTests/ScoreSequenceInteractionRegressionTests
          -only-testing:RiffLoopUITests
          -skip-testing:RiffLoopUITests/GpPanelLayoutTests
          CODE_SIGNING_ALLOWED=NO

      - name: Restart simulator between UI and hosted unit tests
        run: |
          set -euo pipefail
          # Do not retain a UI-test app or WebKit process across xcodebuild's
          # replacement install. A stale host can retain a Dead/ bundle URL and
          # lose every resource when containermanagerd removes the old container.
          xcrun simctl shutdown "$IPAD_DEVICE_ID"
          xcrun simctl boot "$IPAD_DEVICE_ID"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=180)' \
            xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b

      - name: Build and run unit tests on iPad mini
        run: >-
          xcodebuild test
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID"
          -derivedDataPath DerivedData
          -skip-testing:RiffLoopUITests
          -skip-testing:RiffLoopTests/ScoreRegionLayoutTests
          -skip-testing:RiffLoopTests/ScoreSequenceInteractionRegressionTests
          ${{ inputs.run_vision_comparison != true && '-skip-testing:RiffLoopTests/SyntheticVisionTabPreprocessingBenchmarkTests/testIndependentSyntheticVisionPreprocessingComparison' || '' }}
          CODE_SIGNING_ALLOWED=NO

      - name: Capture iPad mini launch screenshot
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name RiffLoop.app -print -quit)"
          test -d "$APP"
          python3 scripts/verify-score-resources.py "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl install "$IPAD_DEVICE_ID" "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl launch "$IPAD_DEVICE_ID" com.riffloop.prototype
          sleep 2
          mkdir -p TestArtifacts
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl io "$IPAD_DEVICE_ID" screenshot TestArtifacts/iPad-mini-home.png

      - name: Export test failure diagnostics
        if: failure()
        run: |
          mkdir -p TestArtifacts/Diagnostics
          for result in DerivedData/Logs/Test/*.xcresult; do
            test -d "$result" || continue
            xcrun xcresulttool export diagnostics --path "$result" --output-path TestArtifacts/Diagnostics || true
          done

      - name: Export practice screenshots for review
        if: always()
        run: |
          mkdir -p TestArtifacts/PracticeScreenshots
          for result in DerivedData/Logs/Test/*.xcresult; do
            test -d "$result" || continue
            destination="TestArtifacts/PracticeScreenshots/$(basename "$result" .xcresult)"
            mkdir -p "$destination"
            xcrun xcresulttool export attachments --path "$result" --output-path "$destination" || true
          done

      - name: Upload practice screenshots for quick review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiffLoop-practice-screenshots
          path: |
            TestArtifacts/PracticeScreenshots/**/*.png
            TestArtifacts/PracticeScreenshots/**/*.jpg
            TestArtifacts/PracticeScreenshots/**/*.jpeg
            TestArtifacts/PracticeScreenshots/**/*.txt
            TestArtifacts/PracticeScreenshots/**/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload iPad mini screenshot and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiffLoop-iPad-mini-validation
          path: |
            TestArtifacts/
            DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 30
