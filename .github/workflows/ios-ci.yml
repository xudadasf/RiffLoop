name: iOS CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "RiffLoop/**"
      - "RiffLoopTests/**"
      - "project.yml"
      - "scripts/test-gp-playback.mjs"
      - "scripts/test-gp-display.mjs"
      - "scripts/test-reported-ios-issues.mjs"
      - "scripts/test-video-mode.mjs"
      - "scripts/test-pdf-mode.mjs"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "RiffLoop/**"
      - "RiffLoopTests/**"
      - "project.yml"
      - "scripts/test-gp-playback.mjs"
      - "scripts/test-gp-display.mjs"
      - "scripts/test-reported-ios-issues.mjs"
      - "scripts/test-video-mode.mjs"
      - "scripts/test-pdf-mode.mjs"
      - ".xcode-version"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test playback policies
        run: |
          node scripts/test-gp-playback.mjs
          node scripts/test-gp-display.mjs
          node scripts/test-reported-ios-issues.mjs
          node scripts/test-video-mode.mjs
          node scripts/test-pdf-mode.mjs

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Prepare iPad mini simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess
          import time

          for _ in range(15):
              data = json.loads(subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              ))
              for runtime, devices in data["devices"].items():
                  for device in devices:
                      if runtime.endswith("iOS-18-5") and device["name"] == "iPad mini (A17 Pro)":
                          print(device["udid"])
                          raise SystemExit(0)
              time.sleep(2)

          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "available", "-j"], text=True,
          ))["runtimes"]
          device_types = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devicetypes", "-j"], text=True,
          ))["devicetypes"]
          runtime = next(item for item in runtimes if item["name"] == "iOS 18.5")
          device_type = next(item for item in device_types if item["name"] == "iPad mini (A17 Pro)")
          print(subprocess.check_output([
              "xcrun", "simctl", "create", "RiffLoop iPad mini",
              device_type["identifier"], runtime["identifier"],
          ], text=True).strip())
          PY
          )"
          echo "IPAD_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=180)' \
            xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build and run unit tests on iPad mini
        run: >-
          xcodebuild test
          -project RiffLoop.xcodeproj
          -scheme RiffLoop
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID"
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Capture iPad mini launch screenshot
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name RiffLoop.app -print -quit)"
          test -d "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl install "$IPAD_DEVICE_ID" "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl launch "$IPAD_DEVICE_ID" com.riffloop.prototype
          sleep 2
          mkdir -p TestArtifacts
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            xcrun simctl io "$IPAD_DEVICE_ID" screenshot TestArtifacts/iPad-mini-home.png

      - name: Export test failure diagnostics
        if: failure()
        run: |
          mkdir -p TestArtifacts/Diagnostics
          for result in DerivedData/Logs/Test/*.xcresult; do
            test -d "$result" || continue
            xcrun xcresulttool export diagnostics --path "$result" --output-path TestArtifacts/Diagnostics || true
          done

      - name: Upload iPad mini screenshot and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiffLoop-iPad-mini-validation
          path: |
            TestArtifacts/
            DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 30
