name: iOS UI audit
on:
  push:
    branches: [codex/ui-audit-20260905]
    paths: [audits/ui-20260905/**, .github/workflows/ios-ui-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - name: Generate audit-only test configuration
        shell: python
        run: |
          from pathlib import Path
          p = Path('project.yml')
          s = p.read_text()
          s = s.replace('      testTargets:\n        - RiffLoopTests', '      testTargets:\n        - RiffLoopTests\n        - RiffLoopAuditUI')
          s = s.replace('      - path: RiffLoopTests\n', '      - path: audits/ui-20260905/seed\n      - path: RiffLoopTests\n')
          s += '''
            RiffLoopAuditUI:
              type: bundle.ui-testing
              platform: iOS
              sources:
                - path: audits/ui-20260905/ui
              dependencies:
                - target: RiffLoop
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.riffloop.audit.ui
                  GENERATE_INFOPLIST_FILE: YES
                  TEST_TARGET_NAME: RiffLoop
          '''
          p.write_text(s)
      - run: xcodegen generate
      - name: Boot iPad mini in dark appearance
        run: |
          DEVICE_ID=$(xcrun simctl create RiffLoop-Audit com.apple.CoreSimulator.SimDeviceType.iPad-mini-A17-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
      - name: Seed disposable simulator
        run: >-
          xcodebuild test -project RiffLoop.xcodeproj -scheme RiffLoop
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -derivedDataPath DerivedData -resultBundlePath Seed.xcresult
          -only-testing:RiffLoopTests/AuditFixtureTests
          CODE_SIGNING_ALLOWED=NO > seed.log 2>&1
      - name: Capture actual app flows
        run: >-
          xcodebuild test-without-building -project RiffLoop.xcodeproj -scheme RiffLoop
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -derivedDataPath DerivedData -resultBundlePath Audit.xcresult
          -only-testing:RiffLoopAuditUI/FullPageAudit/test04SupplementaryPages
          -only-testing:RiffLoopAuditUI/FullPageAudit/test05SystemPicker -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO > audit.log 2>&1
      - name: Export evidence
        if: always()
        run: |
          mkdir -p Evidence
          if [ -d Audit.xcresult ]; then
            xcrun xcresulttool export attachments --path Audit.xcresult --output-path Evidence
            xcrun xcresulttool get test-results tests --path Audit.xcresult > Evidence/tests.json
          fi
          cp seed.log audit.log Evidence/ 2>/dev/null || true
          git rev-parse HEAD > Evidence/source-commit.txt
      - name: Keep named audit images and trees only
        if: always()
        shell: python
        run: |
          import json, pathlib, re, shutil
          src = pathlib.Path('Evidence')
          dst = pathlib.Path('AuditEvidence')
          dst.mkdir(exist_ok=True)
          m = src / 'manifest.json'
          if m.exists():
              tests = json.loads(m.read_text())
              for test in tests:
                  test['attachments'] = [a for a in test.get('attachments', []) if re.match(r'\d+-[a-z0-9-]+_', a.get('suggestedHumanReadableName', ''))]
                  for a in test['attachments']:
                      shutil.copy2(src / a['exportedFileName'], dst / a['exportedFileName'])
              (dst/'manifest.json').write_text(json.dumps(tests))
          for name in ['tests.json', 'seed.log', 'audit.log', 'source-commit.txt']:
              if (src/name).exists(): shutil.copy2(src/name, dst/name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiffLoop-UI-audit-synthetic
          path: AuditEvidence
          retention-days: 7
