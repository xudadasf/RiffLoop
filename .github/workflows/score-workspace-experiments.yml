name: Score workspace independent experiments

on:
  push:
    branches: ["codex/ipad-score-workspace"]
    paths:
      - "experiments/score-region-probe/**"
      - "experiments/gp-edit-roundtrip/**"
      - "experiments/gpif-safety-probe/**"
      - "experiments/gp-archive-safety/**"
      - "experiments/gp-safe-fixture/**"
      - "experiments/gp-fixture-layout/**"
      - "experiments/gp-memory-surgery/**"
      - "experiments/gp-semantic-probe/**"
      - "experiments/gp-note-patch/**"
      - "RiffLoop/Resources/GpWeb/alphaTab.min.js"
      - "RiffLoopTests/Fixtures/transport.gp"
      - ".github/workflows/score-workspace-experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check region evaluation and synthetic pages
        run: python3 -B -m unittest discover -s experiments/score-region-probe -p 'test_*.py'
      - name: Check edited GP round trip on the repository fixture
        run: node experiments/gp-edit-roundtrip/test.cjs
      - name: Document known accidental preservation issue
        run: python3 -B -m unittest discover -s experiments/gp-edit-roundtrip -p 'test_accidental_regression.py'
      - name: Check synthetic shared-reference handling
        run: python3 -B -m unittest discover -s experiments/gpif-safety-probe -p 'test_*.py'
      - name: Check GP archive resource preservation
        run: python3 -B -m unittest discover -s experiments/gp-archive-safety -p 'test_*.py'
      - name: Check isolated fixture edit and resources
        run: python3 -B -m unittest discover -s experiments/gp-safe-fixture -p 'test_*.py'
      - name: Check synthetic score archive layouts
        run: python3 -B -m unittest discover -s experiments/gp-fixture-layout -p 'test_*.py'
      - name: Check in-memory GP archive surgery
        run: python3 -B -m unittest discover -s experiments/gp-memory-surgery -p 'test_*.py'
      - name: Check conservative score candidate selection
        run: python3 -B -m unittest discover -s experiments/gp-semantic-probe -p 'test_*.py'
      - name: Check fixture-only natural note edits
        run: python3 -B -m unittest discover -s experiments/gp-note-patch -p 'test_*.py'
