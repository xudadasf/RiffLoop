<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>电吉他谱面编辑</title><link rel="stylesheet" href="editor.css"></head>
<body data-loading="true">
<header class="glass"><button id="close">返回</button><button id="undo">撤销</button><button id="redo">重做</button><button id="save" class="primary">保存</button></header>
<div class="documentTools glass"><button id="source">原图</button><button id="settings">曲谱设置</button><button id="preview">阅读</button><button id="zoomOut" aria-label="缩小谱面">缩小</button><button id="zoomIn" aria-label="放大谱面">放大</button></div>
<aside class="sidebar"><strong>编辑</strong><button id="rhythmMenu">节奏</button><button id="techniques">技巧</button><button id="bars">小节 / 复制</button><button id="review">已核对</button><button id="keypadToggle">键盘</button></aside>
<main id="scoreViewport"><section id="reference" hidden><img id="sourceImage" alt="当前小节来源区域"><button id="hideSource">收起原图</button></section><div id="paper"><div id="engraving"></div><div id="noteTargets"></div></div></main>
<div id="status" role="status" aria-live="polite">正在打开曲谱…</div>
<div class="navigator glass"><div class="navInfo"><select id="barChoice" aria-label="选择小节"></select><span id="selection"></span></div><div class="navButtons"><button id="prev">上一节</button><button id="next">下一节</button><button id="stringUp">上弦</button><button id="stringDown">下弦</button><button id="beatLeft">前拍</button><button id="beatRight">后拍</button></div></div>
<div class="editDock glass"><div id="rhythm" class="row"></div><div class="row"><button id="rest">休止</button><button id="insertBefore">前插休止</button><button id="insertAfter">后插休止</button><button id="deleteNote">删音</button><button id="deleteBeat">删拍</button><button id="fill">补齐</button></div><span id="timing"></span></div>
<div class="rightDock"><div class="transport glass"><button id="play" disabled>加载音色</button><button id="stop">回到开头</button><button id="loop" aria-pressed="false">循环</button></div><div id="keypad" class="glass" aria-label="品位数字键盘"></div></div>
<dialog id="panel"><div class="panelHeading"><h2 id="panelTitle"></h2><button id="panelClose">完成</button></div><div id="panelBody"></div></dialog>
<script src="../GpWeb/alphaTab.min.js"></script><script src="../GpWeb/riffloop-audio.js"></script><script src="guitar-draft.js"></script><script src="editor-state.js"></script><script src="score-surface.js"></script><script src="editor.js"></script></body></html>
