<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>电吉他谱面编辑</title><link rel="stylesheet" href="editor.css"></head>
<body data-loading="true">
<header class="glass"><button id="close">返回</button><button id="undo">撤销</button><button id="redo">重做</button><button id="save" class="primary">保存</button></header>
<div class="documentTools glass"><button id="source" aria-pressed="false" aria-controls="reference">原图</button><button id="settings">曲谱设置</button><button id="preview">阅读</button><button id="zoomOut" aria-label="缩小谱面">缩小</button><button id="zoomIn" aria-label="放大谱面">放大</button></div>
<aside class="sidebar"><strong>TAB</strong><button id="selectMode" aria-pressed="false">选择</button><button id="editMode" aria-pressed="true">编辑</button><button id="bars">小节 / 复制</button><button id="copyBeat">复制</button><button id="pasteBeat">粘贴</button><button id="review">已核对</button><button id="keypadToggle">键盘</button></aside>
<section id="reference" hidden><div><span id="sourceLabel" role="status"></span><button id="hideSource">收起原图</button></div><img id="sourceImage" hidden alt="当前识别区域的原谱"></section>
<main id="scoreViewport"><div id="paper"><div id="engraving"></div><div id="noteTargets"></div></div></main>
<div id="status" role="status" aria-live="polite">正在打开曲谱…</div>
<div class="navigator glass"><div class="navInfo"><select id="barChoice" aria-label="选择小节"></select><span id="selection"></span></div><div class="barNav"><button id="prev">上一节</button><button id="next">下一节</button></div><div class="navButtons"><button id="stringUp" aria-label="上弦">上弦</button><button id="stringDown" aria-label="下弦">下弦</button><button id="beatLeft" aria-label="前拍">前拍</button><button id="beatRight" aria-label="后拍">后拍</button><button id="thumbPad" aria-label="定位当前音符">定位</button></div></div>
<div class="editDock glass"><div id="toolStrip" role="region" aria-label="当前分类工具"></div><div id="toolTabs" role="tablist" aria-label="谱面编辑工具"></div><div class="dockHint"><span id="toolHint"></span><span id="timing"></span></div></div>
<div class="rightDock"><div class="transport glass"><button id="play" disabled>加载音色</button><button id="stop">回到开头</button><button id="loop" aria-pressed="false">循环</button></div><div id="keypad" class="glass" aria-label="品位数字键盘"></div></div>
<dialog id="panel"><div class="panelHeading"><h2 id="panelTitle"></h2><button id="panelClose">完成</button></div><p id="panelError" role="alert"></p><div id="panelBody"></div></dialog>
<script src="../GpWeb/alphaTab.min.js"></script><script src="../GpWeb/riffloop-audio.js"></script><script src="guitar-draft.js"></script><script src="fflate.min.js"></script><script src="gp-archive.js"></script><script src="gp-document.js"></script><script src="editor-state.js"></script><script src="tap-guard.js"></script><script src="score-surface.js"></script><script src="editor-tools.js"></script><script src="technique-editor.js"></script><script src="source-reference.js"></script><script src="editor.js"></script></body></html>
