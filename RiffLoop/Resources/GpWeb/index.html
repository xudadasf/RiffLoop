<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111216; }
        #viewport {
            width: 100%;
            height: 100%;
            overflow: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            background: #f5f2e9;
            touch-action: pan-x pan-y;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #score {
            position: relative;
            min-width: 100%;
            min-height: 100%;
            color: #171717;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #score.range-press-pending::after,
        #score.range-selecting::after {
            content: "";
            position: absolute;
            z-index: 20;
            left: var(--range-press-x);
            top: var(--range-press-y);
            width: 44px;
            height: 44px;
            margin: -22px 0 0 -22px;
            border: 3px solid #ff9f0a;
            border-radius: 50%;
            pointer-events: none;
        }
        #score.range-press-pending::after {
            background: rgba(255, 159, 10, 0.18);
            animation: range-press-progress 600ms linear forwards;
        }
        #score.range-selecting::after {
            background: rgba(255, 159, 10, 0.42);
            box-shadow: 0 0 0 5px rgba(255, 159, 10, 0.16);
        }
        @keyframes range-press-progress {
            from { transform: scale(0.55); opacity: 0.35; }
            to { transform: scale(1); opacity: 1; }
        }
        #tie-labels { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
        .tie-label {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 0 1px;
            color: #111;
            background: #f5f2e9;
            font: 11px/1.1 -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #synth-score { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
        .at-cursor-bar { background: rgba(0, 122, 255, 0.1) !important; }
        .at-cursor-beat {
            background: transparent !important;
        }
        .at-cursor-beat::after {
            content: "";
            position: absolute;
            inset: 0 auto 0 50%;
            width: 2px;
            transform: translateX(-50%);
            background: rgba(0, 122, 255, 0.82);
            border-radius: 1px;
            box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.75), 0 0 4px rgba(0, 122, 255, 0.42);
        }
        .at-highlight,
        .at-highlight * {
            color: #006edc !important;
            fill: #006edc !important;
        }
        .at-selection div { background: rgba(255, 184, 71, 0.25) !important; }
    </style>
</head>
<body>
    <main id="viewport"><div id="score"><div id="tie-labels"></div></div></main>
    <div id="synth-score"></div>
    <script src="alphaTab.min.js"></script>
    <script src="riffloop-gp.js"></script>
</body>
</html>
