<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111216; }
        #viewport {
            width: 100%;
            height: 100%;
            overflow: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            background: #f5f2e9;
            touch-action: pan-x pan-y;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #score {
            position: relative;
            min-width: 100%;
            min-height: 100%;
            color: #171717;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #tie-labels { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
        .tie-label {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 0 1px;
            color: #111;
            background: #f5f2e9;
            font: 11px/1.1 -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #synth-score { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
        .at-cursor-bar { background: rgba(255, 149, 0, 0.22) !important; }
        .at-cursor-beat { background: #ff7a00 !important; width: 3px !important; }
        .at-selection div { background: rgba(255, 184, 71, 0.25) !important; }
    </style>
</head>
<body>
    <main id="viewport"><div id="score"><div id="tie-labels"></div></div></main>
    <div id="synth-score"></div>
    <script src="alphaTab.min.js"></script>
    <script src="riffloop-gp.js"></script>
</body>
</html>
