name: RiffLoopOCRProbe

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO

packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

targets:
  RiffLoopOCRProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riffloop.ocrprobe
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - RiffLoopOCRProbeTests

  RiffLoopOCRProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # These files are supplied outside the repository and copied only into
      # the disposable simulator test bundle by the build.
      - path: ${ORT_PROBE_MODEL_PATH}
        buildPhase: resources
      - path: cpu_reference_expected.json
        buildPhase: resources
      - path: image_reference_expected.json
        buildPhase: resources
      - path: digit_group_reference.json
        buildPhase: resources
    dependencies:
      - target: RiffLoopOCRProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riffloop.ocrprobe.tests
        GENERATE_INFOPLIST_FILE: YES
