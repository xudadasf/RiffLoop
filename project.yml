name: RiffLoop

options:
  bundleIdPrefix: com.riffloop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO

targets:
  RiffLoop:
    type: application
    platform: iOS
    sources:
      - path: RiffLoop
        excludes:
          - Resources
      - path: RiffLoop/Resources/GpWeb
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riffloop.prototype
        PRODUCT_NAME: RiffLoop
        MARKETING_VERSION: 0.25.19
        CURRENT_PROJECT_VERSION: 62
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: RiffLoop
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - RiffLoopTests

  RiffLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RiffLoopTests
    dependencies:
      - target: RiffLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riffloop.prototype.tests
        GENERATE_INFOPLIST_FILE: YES
